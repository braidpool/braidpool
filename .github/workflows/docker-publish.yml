name: Docker Image Publish

on:
  push:
    branches: [dev]
  workflow_dispatch:  

env:
  REGISTRY: docker.io

jobs:
  build-node:
    name: Build Node Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: braidpool/braidpool
          tags: |
            type=raw,value=node-latest
            type=raw,value=node-dev
            type=sha,prefix=node-sha-,format=short

      - name: Build and push Node image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/node/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-miner:
    name: Build Miner Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: braidpool/braidpool
          tags: |
            type=raw,value=miner-latest
            type=raw,value=miner-dev
            type=sha,prefix=miner-sha-,format=short

      - name: Build and push Miner image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/miner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cpunet:
    name: Build Bitcoin CPUNet Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: braidpool/braidpool
          tags: |
            type=raw,value=cpunet-latest
            type=raw,value=cpunet-dev
            type=sha,prefix=cpunet-sha-,format=short

      - name: Build and push Bitcoin CPUNet image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/cpunet_bitcoin_node/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
