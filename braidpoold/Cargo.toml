[package]
name = "braidpoold"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoincore-rpc = "0.17"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
axum = "0.8.4"
serde_json = "1.0.145"
hyper = { version = "1.7", features = ["server"] }
tower-http = { version = "0.5", features = ["cors"] }
once_cell = "1"
futures = "0.3"
