# Headless service — gives each pod a stable DNS name for P2P discovery
# pod-0.braidpool-headless, pod-1.braidpool-headless ... pod-N.braidpool-headless
apiVersion: v1
kind: Service
metadata:
  name: {{ include "braidpool.fullname" . }}-headless
  labels:
    app: {{ include "braidpool.fullname" . }}
spec:
  clusterIP: None       
  selector:
    app: {{ include "braidpool.fullname" . }}
  ports:
    - name: bitcoin-p2p
      port: {{ .Values.bitcoin.ports.p2p }}
      protocol: TCP
    - name: bitcoin-rpc
      port: {{ .Values.bitcoin.ports.rpc }}
      protocol: TCP
    - name: node-p2p
      port: {{ .Values.node.ports.p2p }}
      protocol: TCP
    - name: node-rpc
      port: {{ .Values.node.ports.rpc }}
      protocol: TCP
    - name: stratum
      port: {{ .Values.node.ports.stratum }}
      protocol: TCP