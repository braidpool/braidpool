apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "braidpool.fullname" . }}
  labels:
    app: {{ include "braidpool.fullname" . }}
spec:
  serviceName: {{ include "braidpool.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "braidpool.fullname" . }}
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels:
        app: {{ include "braidpool.fullname" . }}
    spec:
      containers:

        - name: bitcoin
          image: "{{ .Values.bitcoin.image.repository }}:{{ .Values.bitcoin.image.tag }}"
          imagePullPolicy: {{ .Values.bitcoin.image.pullPolicy }}
          args:
            - -cpunet
            - -conf=/etc/bitcoin/bitcoin.conf
            - -ipcbind=unix:/tmp/bitcoin-ipc/bitcoin.sock
            - -debug=ipc
            - -printtoconsole
            - -addnode={{ .Values.seedNode }}
          ports:
            - name: bitcoin-p2p
              containerPort: {{ .Values.bitcoin.ports.p2p }}
              protocol: TCP
            - name: bitcoin-rpc
              containerPort: {{ .Values.bitcoin.ports.rpc }}
              protocol: TCP
            - name: zmq-hashblock
              containerPort: {{ .Values.bitcoin.ports.zmqHashblock }}
              protocol: TCP
            - name: zmq-sequence
              containerPort: {{ .Values.bitcoin.ports.zmqSequence }}
              protocol: TCP
          volumeMounts:
            - name: bitcoin-data
              mountPath: /data/.bitcoin
            - name: ipc-socket
              mountPath: /tmp/bitcoin-ipc
            - name: config
              mountPath: /etc/bitcoin/bitcoin.conf
              subPath: bitcoin.conf
          resources: {{ toYaml .Values.bitcoin.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - test
                - -S
                - /tmp/bitcoin-ipc/bitcoin.sock
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - test
                - -S
                - /tmp/bitcoin-ipc/bitcoin.sock
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        - name: node
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for bitcoin IPC socket..."
              until test -S /tmp/bitcoin-ipc/bitcoin.sock; do
                echo "Socket not ready, retrying in 3s..."
                sleep 3
              done
              echo "Socket ready — starting braidpool node"
              exec /app/docker-entrypoint.sh
          ports:
            - name: node-p2p
              containerPort: {{ .Values.node.ports.p2p }}
              protocol: TCP
            - name: node-rpc
              containerPort: {{ .Values.node.ports.rpc }}
              protocol: TCP
            - name: stratum
              containerPort: {{ .Values.node.ports.stratum }}
              protocol: TCP
          volumeMounts:
            - name: braidpool-data
              mountPath: /data
            - name: ipc-socket
              mountPath: /tmp/bitcoin-ipc
          env:
            - name: HOME
              value: /data
            - name: BRAIDPOOL_DATADIR
              value: /data/.braidpool
            - name: BRAIDPOOL_BIND
              value: "0.0.0.0:{{ .Values.node.ports.p2p }}"
            - name: BRAIDPOOL_NETWORK
              value: {{ .Values.network }}
            - name: BRAIDPOOL_BITCOIN_HOST
              value: localhost
            - name: BRAIDPOOL_BITCOIN_PORT
              value: "{{ .Values.bitcoin.ports.rpc }}"
            - name: BRAIDPOOL_RPC_USER
              value: {{ .Values.bitcoin.rpc.user }}
            - name: BRAIDPOOL_RPC_PASS
              value: {{ .Values.bitcoin.rpc.password }}
            - name: BRAIDPOOL_IPC_SOCKET
              value: /tmp/bitcoin-ipc/bitcoin.sock
            - name: RUST_LOG
              value: info
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BRAIDPOOL_PEERS
              value: ""
          resources: {{ toYaml .Values.node.resources | nindent 12 }}
          # readinessProbe:
          #   exec:
          #     command:
          #       - curl
          #       - -sf
          #       - http://127.0.0.1:6682/health
          #   initialDelaySeconds: 30
          #   periodSeconds: 15
          #   timeoutSeconds: 5
          #   failureThreshold: 3
          # livenessProbe:
          #   exec:
          #     command:
          #       - curl
          #       - -sf
          #       - http://127.0.0.1:6682/health
          #   initialDelaySeconds: 60
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 3

      volumes:
        # Ephemeral shared volume for IPC socket within the pod
        - name: ipc-socket
          emptyDir: {}
        # Bitcoin config from ConfigMap — mounted outside datadir to avoid collision
        - name: config
          configMap:
            name: {{ include "braidpool.fullname" . }}-config

  volumeClaimTemplates:
    - metadata:
        name: bitcoin-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.bitcoinDataSize }}
    - metadata:
        name: braidpool-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.braidpoolDataSize }}