[braidnetwork_config]
#binding address to which the current
#node binds to 
listen_address = "/ip4/127.0.0.1/tcp/6885"
#add peers to the p2p network other than the boot nodes
peer_nodes = ["/ip4/127.0.0.1/tcp/1234","/ip4/127.0.0.1/tcp/5678"]

[braid_directory]
path = "~/.braidpool"

#public key belonging to the current miner
[miner_config]
miner_pubkey = ""

[bitcoin_config]
# The network can be "main", "testnet4" or "signet or cpunet(preferred)"
network = "cpunet"
# Full path to bitcoind .cookie file.
# Auto-detected per OS if omitted (override only when using a custom -datadir):
#   Linux default:  ~/.bitcoin/{network}/.cookie
#   macOS default:  ~/Library/Application Support/Bitcoin/{network}/.cookie
# The --rpccookie CLI flag takes precedence over this value.
#cookie_path = "/custom/datadir/cpunet/.cookie"

#rpc server configuration
[braid_rpc_config]
rpc_server_addr="127.0.0.1:6682"