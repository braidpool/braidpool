version: "3.9"

services:

  bitcoin:
    build:
      context: https://github.com/braidpool/bitcoin.git#cpunet-image
      dockerfile: DockerFile
    image: bitcoin-cpunet:latest
    container_name: bitcoin-core
    restart: unless-stopped
    volumes:
      - bitcoin_data:/data/.bitcoin
      - ipc_socket:/tmp/bitcoin-ipc
    networks:
      - braidpool_net
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -cpunet -datadir=/data/.bitcoin -rpcuser=braidpool -rpcpassword=changeme getblockcount || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "28333:28333"  
      - "28332:28332"  
      - "38332:38332" 
      - "38338:38338"  

  node:
    build:
      context: .
      dockerfile: ./node/Dockerfile
    image: braidpool-node:latest
    container_name: braidpool-node
    restart: unless-stopped
    depends_on:
      bitcoin:
        condition: service_healthy
    volumes:
      - braidpool_data:/data
      - ipc_socket:/tmp/bitcoin-ipc
    environment:
      - HOME=/data
      - BRAIDPOOL_DATADIR=/data/.braidpool
      - BRAIDPOOL_BIND=0.0.0.0:6680
      - BRAIDPOOL_NETWORK=cpunet
      - BRAIDPOOL_BITCOIN_HOST=bitcoin
      - BRAIDPOOL_BITCOIN_PORT=28332
      - BRAIDPOOL_RPC_USER=braidpool
      - BRAIDPOOL_RPC_PASS=password
      - BRAIDPOOL_IPC_SOCKET=/tmp/bitcoin-ipc/bitcoin.sock
      - BRAIDPOOL_PEERS=""
      - RUST_LOG=info
    ports:
      - "6680:6680" 
      - "6682:6682" 
      - "3333:3333"   
    networks:
      - braidpool_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6682/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  bitcoin_data:
  braidpool_data:
  ipc_socket:     

networks:
  braidpool_net:
    driver: bridge